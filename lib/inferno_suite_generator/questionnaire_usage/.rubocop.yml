# This folder reads better as a few classes that each tell one story than as many small ones, so its length and
# complexity limits are higher than the defaults.
inherit_from: ../../../.rubocop.yml

Metrics/ClassLength:
  Max: 250

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 30

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10
